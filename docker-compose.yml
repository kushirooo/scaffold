name: raf-pms

services:
  postgres:
    image: postgres:18-alpine
    container_name: raf-pms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raf_pms
    ports:
      - '5432:5432'
    volumes:
      - raf_pms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d raf_pms']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raf_pms_pgdata:
