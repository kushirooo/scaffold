name: raf-pms

services:
  postgres:
    image: postgres:18-alpine
    container_name: raf-pms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raf_pms
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18+ stores data under a versioned subdirectory
      # (/var/lib/postgresql/18/docker). Mount the parent, not the old
      # /var/lib/postgresql/data path, or the 18+ image refuses to start.
      - raf_pms_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d raf_pms']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raf_pms_pgdata:
